stages:
    - build-image
    - build-and-test

build-image:
    stage: build-image
    image: docker:latest
    services:
        - docker:dind
    variables:
        DOCKER_HOST: "tcp://docker:2376"
        DOCKER_TLS_CERTDIR: "/certs"
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    script:
        - docker pull $CI_REGISTRY_IMAGE/btn-ubuntu:latest || true
        - docker build --cache-from $CI_REGISTRY_IMAGE/btn-ubuntu:latest -t $CI_REGISTRY_IMAGE/btn-ubuntu:latest -f Scripts/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/btn-ubuntu:latest
    rules:
        - if: $CI_PIPELINE_SOURCE == "web"
          when: always
        - changes:
              - Scripts/Dockerfile
              - Scripts/setup-linux.sh
          when: always
        - when: manual
          allow_failure: true

.build-template:
    stage: build-and-test
    variables:
        GIT_STRATEGY: fetch
    script:
        - cmake --preset ninja-release
        - cmake --build --preset ninja-release
        - ctest --test-dir .build/release --output-on-failure

build-and-test-linux:
    extends: .build-template
    image: $CI_REGISTRY_IMAGE/btn-ubuntu:latest
    tags:
        - linux
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_PIPELINE_SOURCE == "web"

build-and-test-windows:
    extends: .build-template
    before_script:
        - git config --global --add safe.directory $CI_PROJECT_DIR
        - |
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($vsPath) {
                $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
                if (Test-Path $vcvars) {
                    cmd.exe /c "`"$vcvars`" && set" | Foreach-Object {
                        if ($_ -match '^([^=]+)=(.*)$') {
                            $name = $Matches[1]
                            $value = $Matches[2]
                            if ($name -ne 'Path') {
                                Set-Item "env:$name" $value
                            } else {
                                # On ajoute le path VS au path existant
                                $env:Path = "$value;$env:Path"
                            }
                        }
                    }
                }
            }
    tags:
        - windows
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_PIPELINE_SOURCE == "web"
