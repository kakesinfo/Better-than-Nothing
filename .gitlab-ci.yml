stages:
    - build-image
    - build-and-test

build-image:
    stage: build-image
    image: docker:latest
    services:
        - docker:dind
    variables:
        DOCKER_HOST: "tcp://docker:2376"
        DOCKER_TLS_CERTDIR: "/certs"
    before_script:
        - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    script:
        - docker pull $CI_REGISTRY_IMAGE/btn-ubuntu:latest || true
        - docker build --cache-from $CI_REGISTRY_IMAGE/btn-ubuntu:latest -t $CI_REGISTRY_IMAGE/btn-ubuntu:latest -f Scripts/Dockerfile .
        - docker push $CI_REGISTRY_IMAGE/btn-ubuntu:latest
    rules:
        - if: $CI_PIPELINE_SOURCE == "web"
          when: always
        - changes:
              - Scripts/Dockerfile
              - Scripts/setup-linux.sh
          when: always
        - when: manual
          allow_failure: true

build-and-test:
    stage: build-and-test
    image: $CI_REGISTRY_IMAGE/btn-ubuntu:latest
    variables:
        GIT_STRATEGY: fetch
    script:
        - mkdir -p .build
        - cmake --preset ninja-release
        - cmake --build --preset ninja-release --parallel $(nproc)
        - ctest --test-dir .build/release --output-on-failure --parallel $(nproc)
    rules:
        - if: $CI_COMMIT_BRANCH == "main"
        - if: $CI_PIPELINE_SOURCE == "merge_request_event"
        - if: $CI_PIPELINE_SOURCE == "web"
          when: always

